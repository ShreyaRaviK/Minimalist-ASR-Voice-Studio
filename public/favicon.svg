<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0F172A"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#grad)" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Soundwaves and mic -->
  <rect x="26" y="14" width="12" height="22" rx="6" fill="url(#grad)" filter="url(#glow)"/>
  <path d="M19 28C19 35.18 24.82 41 32 41C39.18 41 45 35.18 45 28" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M32 41V50" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M22 50H42" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Audio wave side bars -->
  <line x1="12" y1="26" x2="12" y2="34" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="52" y1="26" x2="52" y2="34" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
